<style>
:root{--bg:#0f1f18;--card:#173126;--card2:#1d3c2f;--text:#f4f7f5;--muted:#b7c7bd;--accent:#8fd3a9;--line:#2c5441}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
header{position:sticky;top:0;z-index:10;background:#10271d;padding:14px 14px 12px;border-bottom:1px solid var(--line)}

input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:#0c1913;color:var(--text);font-size:16px}
main{padding:12px;max-width:950px;margin:auto}
#count{color:var(--muted);font-size:13px;margin:4px 2px 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;cursor:pointer}
.card:hover{background:var(--card2)}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.dtc{font-weight:700;font-size:18px;color:var(--accent)}
.meta{color:var(--muted);font-size:13px;margin-top:2px}
.meaning{margin-top:8px;line-height:1.35}
.details{display:none;margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.card.open .details{display:block}
.row{margin:8px 0}
.label{color:var(--accent);font-weight:700}
.empty{color:var(--muted);text-align:center;padding:30px 0}
</style>

: ""}];
const q = document.getElementById('q');
const results = document.getElementById('results');
const count = document.getElementById('count');

function esc(v){
  return String(v ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function val(r,names){
  for(const n of names) if(n in r && String(r[n]).trim()) return r[n];
  return '';
}
function makeCard(r){
  const dtc=val(r,['kļūda','Kļūda','DTC','dtc']);
  const model=val(r,['Modelis','modelis']);
  const code=val(r,['modeļa kods','Modeļa kods','model code']);
  const meaning=val(r,['ko nozīmē','Ko nozīmē','meaning']);
  const years=val(r,['gads','Gads']);
  const engine=val(r,['dzinējs','Dzinējs']);
  const causes=val(r,['cēloņi','Cēloņi']);
  const todo=val(r,['ko darīt','Ko darīt']);
  const advice=val(r,['ieteikums','Ieteikums']);
  const live=val(r,['live data','Live Data','Live data']);
  const first=val(r,['First Checks','first checks','First checks']);
  const original=val(r,['original year range','Original year range','oriģinālais gadu diapazons']);
  return `<div class="card" onclick="this.classList.toggle('open')">
    <div class="top"><div>
      <div class="dtc">${esc(dtc||'—')}</div>
      <div class="meta">${esc(model)}${code?' · '+esc(code):''}${years?' · '+esc(years):''}</div>
    </div></div>
    <div class="meaning">${esc(meaning)}</div>
    <div class="details">
      ${years?`<div class="row"><span class="label">Gads:</span> ${esc(years)}</div>`:''}
      ${engine?`<div class="row"><span class="label">Dzinējs:</span> ${esc(engine)}</div>`:''}
      ${meaning?`<div class="row"><span class="label">Ko nozīmē:</span> ${esc(meaning)}</div>`:''}
      ${causes?`<div class="row"><span class="label">Cēloņi:</span> ${esc(causes)}</div>`:''}
      ${todo?`<div class="row"><span class="label">Ko darīt:</span> ${esc(todo)}</div>`:''}
      ${advice?`<div class="row"><span class="label">Ieteikums:</span> ${esc(advice)}</div>`:''}
      ${live?`<div class="row"><span class="label">Live Data:</span> ${esc(live)}</div>`:''}
      ${first?`<div class="row"><span class="label">First Checks:</span> ${esc(first)}</div>`:''}
      ${original?`<div class="row"><span class="label">Original year range:</span> ${esc(original)}</div>`:''}
    </div>
  </div>`;
}
function render(){
  const term=q.value.trim().toLowerCase();
  const filtered=!term?DATA:DATA.filter(r=>Object.values(r).some(v=>String(v??'').toLowerCase().includes(term)));
  const shown=filtered.slice(0,100);
  count.textContent=`${filtered.length} atrasti${filtered.length>100?' · rāda pirmos 100':''}`;
  results.innerHTML=shown.length?shown.map(makeCard).join(''):'<div class="empty">Nekas netika atrasts.</div>';
}
q.addEventListener('input',render);
render();
</script>
