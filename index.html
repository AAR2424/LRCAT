const q=document.getElementById('q'),modelSelect=document.getElementById('model'),results=document.getElementById('results'),count=document.getElementById('count'),langSelect=document.getElementById('lang'),notice=document.getElementById('translation-note');
const models=[...new Set(DATA.map(r=>r.Modelis).filter(Boolean))].sort();
models.forEach(m=>modelSelect.add(new Option(m,m)));
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function val(r,names){for(const n of names)if(n in r&&String(r[n]).trim())return r[n];return '';}
function makeCard(r){
 const t=UI[langSelect.value],dtc=val(r,['kļūda','Kļūda','DTC','dtc']),model=val(r,['Modelis','modelis']),code=val(r,['Modeļa kods','modeļa kods','model code']),meaning=val(r,['ko nozīmē','Ko nozīmē','meaning']);
 const fields=[[t.year,val(r,['gads','Gads'])],[t.engine,val(r,['dzinējs','Dzinējs'])],[t.meaning,meaning],[t.causes,val(r,['cēloņi','Cēloņi'])],[t.todo,val(r,['ko darīt','Ko darīt'])],[t.advice,val(r,['ieteikums','Ieteikums'])],[t.live,val(r,['live data','Live Data','Live data'])],[t.first,val(r,['sakotneja parbaude','Sākotnējā pārbaude','First Checks'])],[t.original,val(r,['Sākotnējais kļūdas gadu diapazons','original year range'])]];
 return `<div class="card" tabindex="0" role="button" aria-expanded="false"><div class="top"><div><div class="dtc">${esc(dtc||'—')}</div><div class="meta">${esc(model)}${code?' · '+esc(code):''}${r.gads?' · '+esc(r.gads):''}</div></div></div><div class="meaning">${esc(meaning)}</div><div class="details">${fields.filter(([,v])=>v).map(([label,value])=>`<div class="row"><span class="label">${esc(label)}:</span> ${esc(value)}</div>`).join('')}</div></div>`;
}
function render(){const t=UI[langSelect.value];document.documentElement.lang=langSelect.value;document.title=t.title;document.getElementById('site-title').textContent=t.title;q.placeholder=t.search;modelSelect.options[0].text=t.model;notice.textContent=t.notice;notice.hidden=!t.notice;
 const term=q.value.trim().toLocaleLowerCase();const filtered=DATA.filter(r=>(!modelSelect.value||r.Modelis===modelSelect.value)&&(!term||Object.values(r).some(v=>String(v).toLocaleLowerCase().includes(term))));
 count.textContent=`${filtered.length} ${t.found}${filtered.length>100?' · '+t.first100:''}`;results.innerHTML=filtered.length?filtered.slice(0,100).map(makeCard).join(''):`<div class="empty">${esc(t.empty)}</div>`;
}
results.addEventListener('click',e=>{const card=e.target.closest('.card');if(card){card.classList.toggle('open');card.setAttribute('aria-expanded',String(card.classList.contains('open')));}});
